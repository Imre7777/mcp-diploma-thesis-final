# MCP Educational Server - Production Docker Compose with Security
# Enhanced security: Network isolation, no exposed ports except Caddy

version: '3.8'

services:
  # Qdrant Vector Database (Backend only - NO external ports)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: mcp-qdrant
    restart: unless-stopped
    # NO ports exposed to host!
    expose:
      - "6334"  # gRPC - only accessible within Docker network
      - "6333"  # HTTP - only accessible within Docker network
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__SERVICE__HTTP_PORT=6333
    networks:
      - backend-network  # Only backend network
    # Security hardening
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    read_only: true
    tmpfs:
      - /tmp

  # MCP Educational Server (NO external port - only via Caddy)
  mcp-server:
    build: .
    container_name: mcp-server
    restart: unless-stopped
    # NO ports exposed to host!
    expose:
      - "8000"  # Only accessible within Docker network
    depends_on:
      qdrant:
        condition: service_started
    environment:
      # Vector Database (internal network)
      - VECTOR_DB_URL=http://qdrant:6333
      - DEFAULT_COLLECTION=educational_content
      
      # Server Config
      - HTTP_HOST=0.0.0.0
      - HTTP_PORT=8000
      - LOG_LEVEL=INFO
      
      # RBAC
      - ENABLE_RBAC=true
      - DEFAULT_USER_ROLE=student
      
      # OAuth (set via .env file)
      - ENABLE_AUTH=${ENABLE_AUTH:-false}
      - SCALEKIT_ENV_URL=${SCALEKIT_ENV_URL}
      - SCALEKIT_CLIENT_ID=${SCALEKIT_CLIENT_ID}
      - SCALEKIT_CLIENT_SECRET=${SCALEKIT_CLIENT_SECRET}
      
      # OpenAI
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - EMBEDDING_MODEL=text-embedding-3-large
    volumes:
      # Data directories for ingestion
      - ./data/incoming:/app/data/incoming
      - ./data/processed:/app/data/processed
      - ./data/failed:/app/data/failed
      - ./data/jsonl:/app/data/jsonl:ro
      - ./data/statistics:/app/data/statistics
    networks:
      - frontend-network  # For Caddy
      - backend-network   # For Qdrant
    # Security hardening
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  # Watchdog Service (Backend only)
  watchdog:
    build: .
    container_name: mcp-watchdog
    restart: unless-stopped
    command: python -m src.pipeline.watchdog_service
    depends_on:
      qdrant:
        condition: service_started
    environment:
      # Vector Database (internal network)
      - VECTOR_DB_URL=http://qdrant:6333
      - DEFAULT_COLLECTION=educational_content
      
      # Directories
      - INCOMING_DIR=/app/data/incoming
      - PROCESSED_DIR=/app/data/processed
      - FAILED_DIR=/app/data/failed
      
      # OpenAI for embeddings
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - EMBEDDING_MODEL=text-embedding-3-large
      
      # Logging
      - LOG_LEVEL=INFO
    volumes:
      # Data directories for ingestion
      - ./data/incoming:/app/data/incoming
      - ./data/processed:/app/data/processed
      - ./data/failed:/app/data/failed
      - ./data/statistics:/app/data/statistics
    networks:
      - backend-network  # Only backend network
    # Security hardening
    cap_drop:
      - ALL

  # Caddy Reverse Proxy (ONLY service with external ports)
  caddy:
    image: caddy:2-alpine
    container_name: mcp-caddy
    restart: unless-stopped
    ports:
      - "80:80"      # HTTP (redirects to HTTPS)
      - "443:443"    # HTTPS
      - "443:443/udp"  # HTTP/3 support
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      mcp-server:
        condition: service_started
    networks:
      - frontend-network  # Only frontend network
    environment:
      - DOMAIN=leowiki-mcp.stream
    # Security hardening
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
      - /var/run

networks:
  # Frontend network: Caddy <-> MCP Server
  frontend-network:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: mcp-frontend
    ipam:
      config:
        - subnet: 172.20.0.0/24
  
  # Backend network: MCP Server/Watchdog <-> Qdrant (NO internet access)
  backend-network:
    driver: bridge
    internal: true  # ← IMPORTANT: No external access!
    driver_opts:
      com.docker.network.bridge.name: mcp-backend
    ipam:
      config:
        - subnet: 172.21.0.0/24

volumes:
  qdrant_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
